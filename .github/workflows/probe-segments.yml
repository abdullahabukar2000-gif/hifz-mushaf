# One-off check: which reciters have word-by-word timings (and the fetch log, incl. Tunaiji's surah check; keeps a copy of the published ayah times). The report is
# committed to probe/segments.txt.
name: Probe word timings
on:
  push:
    branches: [claude/great-goodall-w4d11z]
    paths: [.github/workflows/probe-segments.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p probe && python3 scripts/fetch-qdc.py | grep -v '^qdc reciter' | cut -c1-3000 > probe/qdc-log.txt; cat probe/qdc-log.txt; mkdir -p probe/qdc-timings && cp public/data/timings/qdc-*.json probe/qdc-timings/
      - run: |
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add probe/qdc-log.txt probe/qdc-timings && git commit -m "Probe: word timing fetch log" && git pull -q --rebase && git push
