# One-off check: which reciters have word-by-word timings. The report is
# committed to probe/segments.txt.
name: Probe word timings
on:
  push:
    branches: [claude/great-goodall-w4d11z]
    paths: [scripts/probe-segments.py, .github/workflows/probe-segments.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p probe && python3 scripts/probe-segments.py
      - run: |
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add probe/segments.txt && git commit -m "Probe: word timing sources" && git push
