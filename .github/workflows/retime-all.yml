# Find where each ayah really is in every whole-surah recording from
# quran.com (scripts/retime-surah.py), for every reciter played from them. The
# build then uses these times wherever every ayah of a surah checks out.
name: Retime all surahs by listening
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retime:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { reciter: alafasy, part: 1, parts: 6 }
          - { reciter: alafasy, part: 2, parts: 6 }
          - { reciter: alafasy, part: 3, parts: 6 }
          - { reciter: alafasy, part: 4, parts: 6 }
          - { reciter: alafasy, part: 5, parts: 6 }
          - { reciter: alafasy, part: 6, parts: 6 }
          - { reciter: husary, part: 1, parts: 6 }
          - { reciter: husary, part: 2, parts: 6 }
          - { reciter: husary, part: 3, parts: 6 }
          - { reciter: husary, part: 4, parts: 6 }
          - { reciter: husary, part: 5, parts: 6 }
          - { reciter: husary, part: 6, parts: 6 }
          - { reciter: minshawi, part: 1, parts: 6 }
          - { reciter: minshawi, part: 2, parts: 6 }
          - { reciter: minshawi, part: 3, parts: 6 }
          - { reciter: minshawi, part: 4, parts: 6 }
          - { reciter: minshawi, part: 5, parts: 6 }
          - { reciter: minshawi, part: 6, parts: 6 }
          - { reciter: tunaiji, part: 1, parts: 6 }
          - { reciter: tunaiji, part: 2, parts: 6 }
          - { reciter: tunaiji, part: 3, parts: 6 }
          - { reciter: tunaiji, part: 4, parts: 6 }
          - { reciter: tunaiji, part: 5, parts: 6 }
          - { reciter: tunaiji, part: 6, parts: 6 }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ffmpeg >/dev/null 2>&1 && pip install -q onnxruntime numpy
      - uses: actions/cache@v4
        with: { path: align-assets, key: tilawi-e9448a0e }
      - run: |
          mkdir -p align-assets && cd align-assets
          M=https://huggingface.co/muhdur/tilawi-fastconformer-quran/resolve/e9448a0e84f3adb64c28b7a8db501dd8e0e59a84
          for f in fastconformer_full_mixed.onnx vocab.json quran_ctc_tokens.json; do [ -s $f ] || curl -sfL -o $f $M/$f; done
      - run: python3 scripts/fetch-qdc.py > /dev/null
      - run: set -o pipefail; python3 scripts/retime-surah.py ${{ matrix.reciter }} ${{ matrix.part }}/${{ matrix.parts }} 2>&1 | grep -v onnxruntime | tee retime-${{ matrix.reciter }}-${{ matrix.part }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retime-${{ matrix.reciter }}-${{ matrix.part }}
          path: |
            data/timings-retimed/
            probe/heard/
            retime-${{ matrix.reciter }}-${{ matrix.part }}.txt
  save:
    needs: retime
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: got, pattern: retime-*, merge-multiple: true }
      - run: |
          mkdir -p data/timings-retimed probe/heard
          cp -r got/data/timings-retimed/* data/timings-retimed/ 2>/dev/null || true
          cp -r got/probe/heard/* probe/heard/ 2>/dev/null || true
          cat got/retime-*.txt > probe/retime-all.txt || true
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add data/timings-retimed probe && git commit -m "Retimed by listening: all quran.com recordings" && git pull -q --rebase && git push
